spring.application.name=trabajadores-ms
server.port=8082
spring.datasource.url=jdbc:sqlserver://localhost\\VIDAL;databaseName=TrabajadorDB;encrypt=true;trustServerCertificate=true
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Valor de cargoId que corresponde a CONDUCTOR (ese cargo exige número de licencia).
# Verifícalo en la tabla de cargos antes de probar.
trabajadores.cargo.conductor-id=1
